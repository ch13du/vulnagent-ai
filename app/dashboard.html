<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VulnAgent AI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px/1.6 system-ui;background:#0d1422;color:#f2f6ff;margin:0}main{max-width:1100px;margin:35px auto;padding:0 20px}.card{background:#1b293d;border:1px solid #34445a;border-radius:14px;padding:23px;margin:15px 0}h1{font-size:31px;margin:0}h2{font-size:20px}h3{font-size:17px;margin:0}p,small{color:#b9c7d8}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.controls{display:flex;gap:12px;flex-wrap:wrap}input,select{padding:11px;border-radius:8px;background:#111d2e;border:1px solid #52617a;color:white}button{background:#70e7b4;border:0;padding:12px 22px;border-radius:8px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#21334c;padding:16px;border-radius:12px}.metric strong{font-size:28px;display:block}.tag{display:inline-block;background:#40526c;padding:3px 10px;border-radius:30px;font-size:12px}.critical,.high{background:#70313e;color:#ffe3e8}.medium{background:#6b542d;color:#fff0c2}.low{background:#285c4b}.finding{border-top:1px solid #42516a;padding:24px 0}.finding h3{font-size:19px}.section{padding:20px}.card{max-width:100%}.finding:first-of-type{border-top:0}.trace{display:flex;flex-wrap:wrap;gap:9px}.step{flex:1;min-width:170px;border:1px solid #47617b;padding:12px;border-radius:10px}.step strong{display:block}.report{overflow-wrap:anywhere}.sections{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin:16px 0;max-width:100%}.section{background:#142235;border:1px solid #354861;border-radius:10px;padding:14px;min-width:0}.section h4{margin:0 0 8px;color:#9fe6cf;font-size:14px}.section .body{overflow-wrap:anywhere;color:#e1e9f4;font-size:14px;line-height:1.7}.section .body p{color:#e1e9f4;margin:0 0 12px}.section .body ul,.section .body ol{padding-left:23px;margin:8px 0 14px}.section .body li{margin:5px 0}.section .body pre{white-space:pre-wrap;overflow-x:auto;background:#0b1728;border:1px solid #354861;padding:12px;border-radius:8px}.section .body code{background:#263a51;border-radius:3px;padding:2px 4px}.section .body pre code{background:transparent}.section .body h5{margin:14px 0 7px;color:#a9e9d4;font-size:14px}.tablewrap{max-width:100%;overflow-x:auto;margin:12px 0}.section table{width:100%;border-collapse:collapse;font-size:12px;min-width:400px}.section th,.section td{text-align:left;border-bottom:1px solid #354861;padding:9px;vertical-align:top}.section th{color:#a9e9d4;background:#21354b}.muted{color:#b9c7d8}.smallbtn{background:#2c455d;color:#e9f8ff;padding:7px 12px;font-size:12px}.detailsline{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.detailsline>*{margin:0}.finding summary{padding:8px 0}@media(max-width:750px){.sections{grid-template-columns:1fr}}.report h3{margin:12px 0 5px}.report p{color:#e5ecf8}.report code{background:#101d30;padding:2px 4px}.report a,.evidence a{color:#8fdbff}.evidence{border-top:1px solid #42516a;padding:8px 0}summary{cursor:pointer;color:#8debc4}.warn{color:#ffca8d}.notice{border-left:3px solid #70e7b4;padding-left:12px}.score{font-weight:bold;font-size:22px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
.structured-report{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.reportpart{min-width:0;background:#142235;border:1px solid #354861;border-radius:10px;padding:16px}.reportpart h4{color:#9fe6cf;font-size:14px;margin:0 0 9px}.reportpart p{margin:0;color:#e1e9f4;white-space:pre-wrap;overflow-wrap:anywhere}.reportpart ol{padding-left:20px;margin:0;color:#e1e9f4}.reportpart li{padding:3px 0;overflow-wrap:anywhere}.reportpart:nth-child(4),.reportpart:nth-child(5){grid-column:span 2}.finding{min-width:0}.finding .row{align-items:start}.finding h3{max-width:85%;overflow-wrap:anywhere}.warn{font-weight:600}@media(max-width:800px){.structured-report{grid-template-columns:1fr}.reportpart:nth-child(4),.reportpart:nth-child(5){grid-column:auto}}
</style></head><body><main><div class="row"><div><h1>🛡️ VulnAgent AI</h1><p>Read-only vulnerability triage · LangGraph · Mistral · EPSS · CISA KEV</p></div><span class="tag">READ-ONLY v1.2</span></div>
<div class="card"><form class="controls" id="form"><input type="file" id="file" accept=".csv" required><select id="mode"><option value="demo">Offline demo</option><option value="live">Live Mistral + threat intelligence</option></select><button id="go">Analyze</button></form><p class="notice">Use synthetic or authorized data only. Live mode sends findings to Mistral. No automatic remediation.</p></div><div id="results"><div class="card">Upload <code>samples/nessus_demo.csv</code> or <code>samples/public_cve_lab.csv</code> to begin.</div></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inlineMarkdown(s){let t=esc(s);t=t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>{try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?'<a href="'+esc(u.href)+'" target="_blank" rel="noopener noreferrer">'+label+'</a>':label}catch{return label}});return t}
function markdown(s){const lines=String(s||'').replace(/\r/g,'').split('\n');let out='',para=[],list='',code=false,codeLines=[];function flush(){if(para.length){out+='<p>'+para.map(inlineMarkdown).join('<br>')+'</p>';para=[]}}function closeList(){if(list){out+='</'+list+'>';list=''}}for(let i=0;i<lines.length;i++){const line=lines[i],t=line.trim();if(t.startsWith('```')){flush();closeList();if(code){out+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';codeLines=[]}code=!code;continue}if(code){codeLines.push(line);continue}if(!t){flush();closeList();continue}if(/^\|.+\|$/.test(t)&&i+1<lines.length&&/^\|?[\s:|-]+\|?$/.test(lines[i+1].trim())){flush();closeList();let rows=[t];i+=2;while(i<lines.length&&/^\|.+\|$/.test(lines[i].trim())){rows.push(lines[i].trim());i++}i--;const cells=x=>x.replace(/^\||\|$/g,'').split('|').map(v=>v.trim());out+='<div class="tablewrap"><table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inlineMarkdown(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inlineMarkdown(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}let h=t.match(/^#{1,6}\s+(.+)$/);if(h){flush();closeList();out+='<h5>'+inlineMarkdown(h[1])+'</h5>';continue}if(/^---+$/.test(t)){flush();closeList();out+='<hr>';continue}let bullet=t.match(/^[-*+]\s+(.+)$/),number=t.match(/^\d+[.)]\s+(.+)$/);if(bullet||number){flush();let kind=bullet?'ul':'ol';if(list!==kind){closeList();list=kind;out+='<'+kind+'>'}out+='<li>'+inlineMarkdown((bullet||number)[1])+'</li>';continue}closeList();para.push(t)}flush();closeList();if(code)out+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';return out||'<p>No narrative provided.</p>'}
function renderSections(r){
 const v=r.report||{};
 const line=(label,content)=>'<section class="reportpart"><h4>'+esc(label)+'</h4><p>'+esc(content||'Not available')+'</p></section>';
 const items=(label,values)=>'<section class="reportpart"><h4>'+esc(label)+'</h4><ol>'+((Array.isArray(values)?values:[]).map(x=>'<li>'+esc(x)+'</li>').join('')||'<li>Not available</li>')+'</ol></section>';
 return '<div class="structured-report">'+line('Assessment',v.assessment)+line('Evidence summary',v.evidence_summary)+line('Uncertainty',v.uncertainty)+items('Recommended actions',v.recommended_actions)+items('Validation steps',v.validation_steps)+'</div>';
}
function renderFinding(r){return '<article class="finding"><div class="row"><h3>'+esc(r.name)+'</h3><span class="tag '+esc(r.risk)+'">'+esc(r.risk.toUpperCase())+'</span></div><div class="row"><small>'+esc(r.host)+' · '+esc(r.cve||'No verified CVE')+'</small><span class="score">'+r.priority_score+'/100</span></div><small>Score: severity '+r.score_breakdown.severity+' + EPSS '+r.score_breakdown.epss+' + KEV '+r.score_breakdown.kev+'</small><div class="detailsline"><small>Source: '+esc(r.generated_by)+'</small><span class="tag">Human approval required</span></div>'+renderSections(r)+(r.warning?'<p class="warn">'+esc(r.warning)+'</p>':'')+'<details><summary>Evidence & source status ('+r.evidence.length+')</summary><p>'+esc(r.enrichment_status)+'</p>'+(r.evidence.length?r.evidence.map(e=>'<div class="evidence">'+esc(e.source)+' · '+esc(e.claim)+': '+esc(e.value)+' · <a href="'+esc(e.url)+'" target="_blank" rel="noopener noreferrer">Source</a></div>').join(''):'<p>No external evidence retrieved. Input findings are unverified.</p>')+'</details></article>'}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('results'),btn=document.getElementById('go');btn.disabled=true;out.innerHTML='<div class="card">Analyzing findings…</div>';let data=new FormData();data.append('file',document.getElementById('file').files[0]);try{let res=await fetch('/analyze?mode='+document.getElementById('mode').value,{method:'POST',body:data});let x=await res.json();if(!res.ok)throw Error(x.detail||JSON.stringify(x));let values=[['Findings',x.count],['Critical',x.ranked.filter(f=>f.risk==='critical').length],['High',x.ranked.filter(f=>f.risk==='high').length],['KEV matches',x.ranked.filter(f=>f.kev===true).length]];out.innerHTML='<div class="grid">'+values.map(v=>'<div class="metric"><small>'+v[0]+'</small><strong>'+v[1]+'</strong></div>').join('')+'</div><div class="card"><h2>LangGraph execution</h2><div class="trace">'+x.trace.map(t=>'<div class="step"><strong>'+esc(t.node.replace(/_/g,' '))+'</strong><small>'+esc(t.status)+'</small><p>'+esc(t.detail)+'</p></div>').join('')+'</div></div><div class="card"><h2>Prioritized remediation</h2>'+x.recommendations.map(renderFinding).join('')+'</div><p>Priority is an illustrative heuristic, not CVSS. Missing intelligence does not imply safety. All changes require analyst review.</p>'}catch(err){out.innerHTML='<div class="card warn">'+esc(err.message)+'</div>'}finally{btn.disabled=false}};
</script></body></html>
